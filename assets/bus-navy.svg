<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 186" width="460" height="186" role="img">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#62889F"/>
      <stop offset="0.52" stop-color="#33586E"/>
      <stop offset="1" stop-color="#1E3D4F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E8F1F4"/>
      <stop offset="0.45" stop-color="#A8C2CD"/>
      <stop offset="1" stop-color="#6D8996"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0C211B" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <ellipse cx="232" cy="163" rx="150" ry="7" fill="#153D32" opacity="0.05"/>

  <!-- main shell -->
  <rect x="22" y="30" width="416" height="108" rx="26" fill="url(#body)"/>
  <rect x="22" y="30" width="416" height="108" rx="26" fill="url(#shade)"/>

  <!-- roof highlight -->
  <rect x="46" y="37" width="350" height="8" rx="4" fill="#ffffff" opacity="0.24"/>

  <!-- windshield -->
  <rect x="33" y="53" width="48" height="44" rx="11" fill="url(#glass)"/>
  <path d="M41 57 h10 l-6 36 h-6 z" fill="#ffffff" opacity="0.35"/>

  <!-- side window band -->
  <rect x="93" y="53" width="311" height="44" rx="9" fill="url(#glass)"/>
  <g stroke="#1E3D4F" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M170 56 v38"/>
    <path d="M247 56 v38"/>
    <path d="M324 56 v38"/>
  </g>
  <g fill="#ffffff" opacity="0.28">
    <rect x="100" y="58" width="26" height="34" rx="6"/>
    <rect x="177" y="58" width="26" height="34" rx="6"/>
    <rect x="254" y="58" width="26" height="34" rx="6"/>
  </g>

  <!-- waist line -->
  <rect x="30" y="106" width="400" height="5" rx="2.5" fill="#ffffff" opacity="0.26"/>

  <!-- lights -->
  <rect x="24" y="99" width="17" height="11" rx="5.5" fill="#FFF3CE"/>
  <rect x="24" y="99" width="17" height="11" rx="5.5" fill="#FFD98A" opacity="0.55"/>
  <rect x="419" y="99" width="15" height="11" rx="5.5" fill="#F39B84"/>

  <!-- wheels -->
  <g>
    <circle cx="130" cy="136" r="25" fill="#2C3332"/>
    <circle cx="130" cy="136" r="25" fill="none" stroke="#1A211F" stroke-width="2" opacity="0.5"/>
    <circle cx="130" cy="136" r="10.5" fill="#CBD4D2"/>
    <circle cx="130" cy="136" r="4" fill="#93A09D"/>
  </g>
  <g>
    <circle cx="352" cy="136" r="25" fill="#2C3332"/>
    <circle cx="352" cy="136" r="25" fill="none" stroke="#1A211F" stroke-width="2" opacity="0.5"/>
    <circle cx="352" cy="136" r="10.5" fill="#CBD4D2"/>
    <circle cx="352" cy="136" r="4" fill="#93A09D"/>
  </g>

  <!-- mirror -->
  <path d="M40 60 q-10 -6 -12 4" fill="none" stroke="#1E3D4F" stroke-width="3" stroke-linecap="round"/>
</svg>
